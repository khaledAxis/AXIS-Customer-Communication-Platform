# Host-neutral application services. HTTPS/load balancing is supplied by the host.
name: axis-ccp
services:
  app:
    image: ${AXIS_IMAGE:?Set an immutable application image tag or digest}
    env_file: ${AXIS_ENV_FILE:?Set the absolute path of the external runtime env file}
    environment:
      AXIS_HOSTED: "true"
      PROVIDER_PILOT_ENABLED: "false"
      QA_EMAIL_ENABLED: "false"
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=1000,gid=1000
      - /app/.next/cache:rw,noexec,nosuid,size=64m,uid=1000,gid=1000
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 200
    mem_limit: 1g
    cpus: 1.0
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:${AXIS_HTTP_PORT:-3000}:3000"
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}
  migrate:
    image: ${AXIS_MIGRATOR_IMAGE:?Set the matching immutable migrator image}
    env_file: ${AXIS_ENV_FILE:?Set the external runtime env file}
    profiles: [tools]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  worker:
    image: ${AXIS_WORKER_IMAGE:-axis-ccp:worker}
    profiles: [scheduler]
    env_file: ${AXIS_WORKER_ENV_FILE:-worker.env}
    environment:
      SCHEDULER_URL: http://app:3000/api/internal/jobs/tick
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 50
    mem_limit: 128m
    cpus: 0.25
    stop_grace_period: 15s
    depends_on: [app]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
